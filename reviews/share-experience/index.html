<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>JOUK - Share Experience</title>

    <!-- Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet"
          href="share-experience.css">

    <link rel="stylesheet" href="../../shared/brand.css">

    <script src="../../shared/site-path.js"></script>
<link rel="stylesheet" href="../../shared/page-loader.css?v=jordan-navigation-3">
<script src="../../shared/page-loader.js?v=jordan-navigation-3" defer></script>

<style>
    .add-photo,
    .photo-list {
        display: none !important;
    }
</style>
</head>


<body>
<div class="page-loader" role="status" aria-label="Loading JOUK">
    <div class="page-loader-spinner" aria-hidden="true"></div>
    <span class="page-loader-logo" aria-hidden="true">JOUK</span>
    <span class="page-loader-label" aria-hidden="true">LOADING</span>
</div>



    <!-- ================= HEADER ================= -->

    <header class="main-header site-header">
        <a href="../../home%20page/index.html" class="logo">JOUK</a>

        <nav class="site-nav" aria-label="Main navigation">
            <a href="../../home%20page/index.html">Home</a>
            <a href="../../plans/index.html">Plans</a>
            <a href="../../other%20pages/create-plan/index.html">My Path</a>
            <a href="../../reviews/community/index.html" class="active" aria-current="page">Community</a>
        </nav>

        <a href="../../sign%20up-log%20in/index.html" class="profile-icon site-account" aria-label="Log in or sign up">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9"></circle>
                <circle cx="12" cy="8" r="3.5"></circle>
                <path d="M5.5 19c.8-3.2 3-5 6.5-5s5.7 1.8 6.5 5"></path>
            </svg>
        </a>
    </header>



    <!-- ================= PAGE ================= -->

    <main class="share-page">

        <div class="share-container">


            <!-- ================= TITLE ================= -->

            <div class="page-heading">

                <a href="javascript:history.back()"
                   class="back-btn"
                   aria-label="Go back">
                    ←
                </a>


                <div>

                    <h1>
                        Share Your Experience
                    </h1>

                    <p>
                        Tell other travelers about your visit.
                    </p>

                </div>

            </div>



            <!-- ================= PLACE ================= -->

            <section class="place-box">

                <label
    for="placeImageInput"
    style="
        width: 180px;
        height: 130px;
        border: 2px dashed #ccc;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        overflow: hidden;
        flex-shrink: 0;
    "
>
    <img
        id="placeImage"
        alt="Selected place"
        class="place-image"
        style="display: none; width: 100%; height: 100%; object-fit: cover;"
    >

    <span
        id="placeImagePlaceholder"
        style="text-align: center; padding: 10px;"
    >
        📷
        Add Place Photo
    </span>

    <input
        type="file"
        id="placeImageInput"
        accept="image/*"
        hidden
    >
</label>


                <div class="place-info">

                 <h2>
    <input
        type="text"
        id="placeName"
        placeholder="Place name (e.g. Petra)"
        maxlength="100"
        aria-label="Place name"
        style="width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:8px;font:inherit;box-sizing:border-box;"
    >
</h2>

<p>
    <input
        type="text"
        id="placeLocation"
        placeholder="Location (e.g. Wadi Musa, Jordan)"
        maxlength="150"
        aria-label="Place location"
        style="width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:8px;font:inherit;box-sizing:border-box;"
    >
</p>

                </div>

            </section>



            <!-- ================= EXPERIENCE TEXT ================= -->

            <section class="form-section">

                <label for="experienceText">
                    How was your experience?
                </label>


                <textarea
                    id="experienceText"
                    maxlength="500"
                    placeholder="Share your thoughts, tips, what you liked, and anything that can help other travelers..."
                ></textarea>

            </section>



            <!-- ================= PHOTOS ================= -->

            <section class="form-section">

                <label>
                    Add photos
                </label>


                <p class="section-description">
                    Upload up to 10 photos
                </p>


                <div class="photo-list"
                     id="photoList">


                    <label class="add-photo">

                        <span>
                            +
                        </span>

                        <small>
                            Add Photo
                        </small>


                        <input
                            type="file"
                            id="photoInput"
                            accept="image/*"
                            multiple
                            hidden
                        >

                    </label>


                </div>

            </section>



            <!-- ================= RATING ================= -->

            <section class="form-section">

                <label>
                    Your rating
                </label>


                <div class="stars"
                     id="stars">

                    <button type="button"
                            data-rating="1">
                        ☆
                    </button>

                    <button type="button"
                            data-rating="2">
                        ☆
                    </button>

                    <button type="button"
                            data-rating="3">
                        ☆
                    </button>

                    <button type="button"
                            data-rating="4">
                        ☆
                    </button>

                    <button type="button"
                            data-rating="5">
                        ☆
                    </button>

                </div>

            </section>



            <!-- ================= TAGS ================= -->

            <section class="form-section">

                <label>

                    Tags

                    <span>
                        (optional)
                    </span>

                </label>


                <div class="tags">


                    <button type="button"
                            class="tag">
                        Relaxation
                    </button>


                    <button type="button"
                            class="tag">
                        Nature
                    </button>


                    <button type="button"
                            class="tag">
                        Sunset
                    </button>


                    <button type="button"
                            class="tag">
                        Family Friendly
                    </button>


                    <button type="button"
                            class="tag">
                        Adventure
                    </button>


                </div>

            </section>



            <!-- ================= SHARE BUTTON ================= -->

            <button
                id="shareBtn"
                class="share-btn"
                type="button"
            >

                Share Experience

                <span>
                    →
                </span>

            </button>


        </div>

    </main>



    <!-- ================= JAVASCRIPT ================= -->

   <script type="module" src="share-experience.js"></script>


</body>

</html>
