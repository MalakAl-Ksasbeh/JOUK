<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JOUK - Login</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../shared/brand.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="../shared/site-path.js"></script>
    <link rel="stylesheet" href="../shared/page-loader.css">
    <script src="../shared/page-loader.js" defer></script>
</head>


<body>
<div class="page-loader" role="status" aria-label="Loading JOUK">
    <div class="page-loader-spinner" aria-hidden="true"></div>
    <span class="page-loader-logo" aria-hidden="true">JOUK</span>
    <span class="page-loader-label" aria-hidden="true">LOADING</span>
</div>


    <main class="login-page">

    <section class="login-story" aria-labelledby="login-story-title">
        <h1 id="login-story-title">

            <span class="welcome-arabic" lang="ar" dir="rtl">اهلاً وسهلاً</span>

            <span class="login-story-subtitle" id="loginStorySubtitle">Welcome back!</span>
            <span class="signup-story-copy" id="signupStoryCopy" hidden>
                <span>Discover Jordan</span>
                <small>In a new way</small>
            </span>
        </h1>
        <div class="story-divider" aria-hidden="true"></div>
        <div class="story-highlights">
            <div class="story-highlight">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"></path></svg>
                <span>Explore<br>Hidden Gems</span>
            </div>
            <div class="story-highlight">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.5"></circle><path d="M3.5 20a5.5 5.5 0 0 1 11 0M14.5 15a4.7 4.7 0 0 1 6 4.5"></path></svg>
                <span>See Others'<br>Experiences</span>
            </div>
            <div class="story-highlight">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5 8.5 4 15.5 6l5.5-2.5v14L15.5 20l-7-2L3 20V6.5Z"></path><path d="M8.5 4v14M15.5 6v14"></path><path d="m11 9 2-2 2 2M13 7v5"></path></svg>
                <span>Plan Your<br>Routes</span>
            </div>
        </div>
    </section>
    




    <div class="login-card">


            <!-- LOGIN / SIGN UP TABS -->

            <div class="tabs" id="tabs">

                <div class="tab-slider"></div>

                <button
                    type="button"
                    class="tab active"
                    id="loginTab"
                >
                    Log in
                </button>

                <button
                    type="button"
                    class="tab"
                    id="signupTab"
                >
                    Sign up
                </button>

            </div>



            <!-- ================= LOGIN ================= -->

            <form
                class="login-form"
                id="loginForm"
            >

                <!-- Email -->

                <div class="input-box">

                    <i
                        data-lucide="mail"
                        class="input-icon"
                    ></i>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Email"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- Password -->

                <div class="input-box">

                    <i
                        data-lucide="lock-keyhole"
                        class="input-icon"
                    ></i>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="eye-btn"
                        data-target="loginPassword"
                        aria-label="Show or hide password"
                    >

                        <i data-lucide="eye"></i>

                    </button>

                </div>



                <!-- Forgot Password -->

                <a
                    href="#"
                    class="forgot-password"
                >
                    Forgot Password?
                </a>



                <!-- Login Button -->

                <button 
                    type="submit"
                    class="login-btn">
                  
                    Login  ›
</button> 
                
                

            </form>



            <!-- Continue as Guest -->

            <button 
                type="button"
                class="guest-btn"
                id="guestBtn"
                onclick="window.location.href='../home%20page/index.html'">
                Continue as Guest
               
            </button>



            <!-- ================= SIGN UP ================= -->

            <form
                class="signup-form"
                id="signupForm"
            >


                <!-- Full Name -->

                <div class="input-box">

                    <i
                        data-lucide="user"
                        class="input-icon"
                    ></i>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Full Name"
                        autocomplete="name"
                        required
                    >

                </div>



                <!-- Email -->

                <div class="input-box">

                    <i
                        data-lucide="mail"
                        class="input-icon"
                    ></i>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Email"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- Password -->

                <div class="input-box">

                    <i
                        data-lucide="lock-keyhole"
                        class="input-icon"
                    ></i>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye-btn"
                        data-target="signupPassword"
                        aria-label="Show or hide password"
                    >

                        <i data-lucide="eye"></i>

                    </button>

                </div>



                <!-- Confirm Password -->

                <div class="input-box">

                    <i
                        data-lucide="shield-check"
                        class="input-icon"
                    ></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye-btn"
                        data-target="confirmPassword"
                        aria-label="Show or hide password"
                    >

                        <i data-lucide="eye"></i>

                    </button>

                </div>



                <!-- Sign Up Button -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Sign up ›
                </button>

            </form>

        </div>

    <div class="login-location-caption">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
        <span>Jordan <b>›</b> <a href="../plans/culture/index.html#petra-card">Petra</a></span>
    </div>
    <p class="login-journey-caption">JOUK</p>

    </main>


    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

<script type="module" src="login.js"></script>
</body>

</html>
