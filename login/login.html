<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JOUK - Login</title>

    <link rel="stylesheet" href="login.css">
</head>


<body>

    <main class="login-page">

        <div class="login-card">


            <!-- LOGIN / SIGN UP TABS -->

            <div class="tabs" id="tabs">

                <div class="tab-slider"></div>

                <button
                    type="button"
                    class="tab active"
                    id="loginTab"
                >
                    Log in
                </button>

                <button
                    type="button"
                    class="tab"
                    id="signupTab"
                >
                    Sign up
                </button>

            </div>



            <!-- ================= LOGIN ================= -->

            <form
                class="login-form"
                id="loginForm"
            >

                <!-- Email -->

                <div class="input-box">

                    <i
                        data-lucide="mail"
                        class="input-icon"
                    ></i>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Email"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- Password -->

                <div class="input-box">

                    <i
                        data-lucide="lock-keyhole"
                        class="input-icon"
                    ></i>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="eye-btn"
                        data-target="loginPassword"
                        aria-label="Show or hide password"
                    >

                        <i data-lucide="eye"></i>

                    </button>

                </div>



                <!-- Forgot Password -->

                <a
                    href="#"
                    class="forgot-password"
                >
                    Forgot Password?
                </a>



                <!-- Login Button -->

                <button 
                    type="submit"
                    class="login-btn">
                  
Login→
</button> 
                
                

            </form>



            <!-- Continue as Guest -->

            <button 
                type="button"
                class="guest-btn"
                id="guestBtn"
                onclick="window.location.href='../index.html'">
                Continue as Guest
               
            </button>



            <!-- ================= SIGN UP ================= -->

            <form
                class="signup-form"
                id="signupForm"
            >


                <!-- Full Name -->

                <div class="input-box">

                    <i
                        data-lucide="user"
                        class="input-icon"
                    ></i>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Full Name"
                        autocomplete="name"
                        required
                    >

                </div>



                <!-- Email -->

                <div class="input-box">

                    <i
                        data-lucide="mail"
                        class="input-icon"
                    ></i>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Email"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- Password -->

                <div class="input-box">

                    <i
                        data-lucide="lock-keyhole"
                        class="input-icon"
                    ></i>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye-btn"
                        data-target="signupPassword"
                        aria-label="Show or hide password"
                    >

                        <i data-lucide="eye"></i>

                    </button>

                </div>



                <!-- Confirm Password -->

                <div class="input-box">

                    <i
                        data-lucide="shield-check"
                        class="input-icon"
                    ></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="eye-btn"
                        data-target="confirmPassword"
                        aria-label="Show or hide password"
                    >

                        <i data-lucide="eye"></i>

                    </button>

                </div>



                <!-- Sign Up Button -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Sign up →
                </button>

            </form>

        </div>

    </main>


    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

<script type="module" src="login.js"></script>
</body>

</html>
